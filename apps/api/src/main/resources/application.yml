server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: ca-practice-api
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    show-sql: false
    open-in-view: false

  datasource:
    url: jdbc:postgresql://localhost:5432/ca_platform
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  redis:
    url: redis://localhost:6379
    timeout: 2000ms

  security:
    user:
      name: admin
      password: admin
      roles: ADMIN

logging:
  level:
    root: INFO
    com.caplatform: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
